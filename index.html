          name: "Your name",
          phone: "Phone number (optional)",
          addr: "Delivery address (or write: I will pick up)",
          send: "Send order on WhatsApp",
          fallback: "If WhatsApp doesn't open, copy this message and send it to the shop:",
          nothing: "Nothing selected yet.",
          errEmpty: "Please choose a size first.",
          errName: "Please enter your name.",
          errAddr: "Please enter your address.",
          pcs: "pcs",
          perPc: "kg / piece",
          less: "Less",
          more: "More",
          close: "Close",
          add: "Add",
          askMsg: "Hello " + SHOP.name + ", I need rates and availability.",
          hello: "Hello " + SHOP.name + ", my order:",
          mName: "Name",
          mPhone: "Phone",
          mAddr: "Address",
          mEnd: "Please confirm the final rate and availability.",
        },
      };

      // ##############################################################
      //  NEECHE KA CODE CHHEDNE KI ZAROORAT NAHI
      // ##############################################################
      function parse(txt) {
        var secs = [], cur = null, bad = [], id = 0;
        txt.split("\n").forEach(function (line) {
          line = line.trim();
          if (!line || line.indexOf("//") === 0) return;
          if (line.indexOf("##") === 0) {
            var h = line.slice(2).split("|");
            cur = {
              n: h[0].trim(),
              p: h.length > 1 ? h[1].trim() : h[0].trim(),
              k: h.length > 2 && h[2].trim() === "kg",
              items: [],
            };
            secs.push(cur);
            return;
          }
          var p = line.split("|").map(function (x) { return x.trim(); });
          var kg = parseFloat(p[1]),
            r = isNaN(+p[2]) ? RATE[p[2]] : +p[2];
          if (!cur || p.length < 3 || !(kg > 0) || !(r > 0)) { bad.push(line); return; }
          var nn = p[0] + (cur.k ? " (" + kg + " kg)" : "");
          cur.items.push({ id: id++, sz: p[0], showKg: cur.k, kg: kg, r: r, t: cur.p + (cur.p ? " " : "") + nn });
        });
        return { secs: secs, bad: bad };
      }

      var D = parse(DATA), qty = {}, ALL = [], LANG = "hi", KEY = "at_order_v2";
      function $(i) { return document.getElementById(i); }
      function T(k) { return TEXT[LANG][k]; }
      function store(k, v) { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) {} return v; }
      function esc(t) {
        return String(t).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }
      function wa(t) { return "https://wa.me/" + SHOP.phone + "?text=" + encodeURIComponent(t); }
      function inr(n) { return "≈ ₹" + (Math.round(n / 10) * 10).toLocaleString("en-IN"); }

      if (D.bad.length) {
        console.warn("Galat lines:", D.bad);
        if (location.hash === "#check") {
          $("chk").style.display = "block";
          $("chk").textContent = "Yeh lines galat hain (naam | weight | rate):\n" + D.bad.join("\n");
        }
      }

      $("brand").textContent = SHOP.name.toUpperCase();
      $("ftPh").href = "tel:+" + SHOP.phone;
      $("ftPh").textContent = "+" + SHOP.phone.slice(0, 2) + " " + SHOP.phone.slice(2, 7) + " " + SHOP.phone.slice(7);

      // ---- List ----
      $("list").innerHTML = D.secs.map(function (s, si) {
        return (
          '<details class="grp" id="g' + si + '"><summary><span class="t">' + esc(s.n) +
          '</span><b class="cnt" id="c' + si + '"></b></summary><div class="body">' +
          s.items.map(function (it) {
            ALL.push({ it: it, si: si });
            return (
              '<div class="row" id="r' + it.id + '"><div class="nm"><span>' + esc(it.sz) + "</span>" +
              (it.showKg ? '<small data-kg="' + it.kg + '"></small>' : "") + "</div>" +
              '<div><button class="add" data-id="' + it.id + '" data-d="1">+</button>' +
              '<div class="qty"><button class="qb" data-id="' + it.id + '" data-d="-1">&minus;</button>' +
              '<input id="o' + it.id + '" data-id="' + it.id + '" type="number" min="0" value="0" inputmode="numeric">' +
              '<button class="qb" data-id="' + it.id + '" data-d="1">+</button></div></div></div>'
            );
          }).join("") +
          "</div></details>"
        );
      }).join("");

      function setQ(id, v, quiet) {
        v = Math.max(0, Math.min(9999, Math.floor(+v) || 0));
        qty[id] = v;
        $("o" + id).value = v;
        $("r" + id).className = "row" + (v > 0 ? " on" : "");
        if (!quiet) upd();
      }
      $("list").addEventListener("click", function (e) {
        var b = e.target.closest(".add, .qb");
        if (!b) return;
        var wasAdd = b.classList.contains("add");
        setQ(b.dataset.id, (qty[b.dataset.id] || 0) + +b.dataset.d);
        if (wasAdd) $("r" + b.dataset.id).querySelectorAll(".qb")[1].focus();
      });
      $("list").addEventListener("change", function (e) {
        if (e.target.dataset.id) setQ(e.target.dataset.id, e.target.value);
      });

      $("q").addEventListener("input", function () {
        var words = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean), any = {}, hit = false;
        ALL.forEach(function (a) {
          var hay = (D.secs[a.si].n + " " + a.it.sz).toLowerCase();
          var m = words.every(function (w) { return hay.indexOf(w) > -1; });
          $("r" + a.it.id).style.display = m ? "" : "none";
          if (m) { any[a.si] = 1; hit = true; }
        });
        D.secs.forEach(function (s, si) {
          $("g" + si).style.display = any[si] ? "" : "none";
          if (words.length && any[si]) $("g" + si).open = true;
        });
        $("empty").style.display = hit ? "none" : "block";
      });

      // ---- Order ----
      function lines() {
        var a = [];
        ALL.forEach(function (x) {
          var q = qty[x.it.id] || 0;
          if (q > 0) a.push({ t: x.it.t, q: q, si: x.si, w: q * x.it.kg, amt: q * x.it.kg * x.it.r });
        });
        return a;
      }
      function total(L) { return L.reduce(function (s, l) { return s + l.amt; }, 0); }
      function wt(L) { return "≈ " + Math.round(L.reduce(function (s, l) { return s + l.w; }, 0)).toLocaleString("en-IN") + " kg"; }

      function save() {
        var keep = {};
        ALL.forEach(function (x) { if (qty[x.it.id] > 0) keep[x.it.t] = qty[x.it.id]; });
        store(KEY, JSON.stringify({ q: keep, nm: $("nm").value, ph: $("ph").value, ad: $("ad").value }));
      }
      function load() {
        try {
          var s = JSON.parse(store(KEY) || "null");
          if (!s) return;
          ALL.forEach(function (x) { if (s.q && s.q[x.it.t]) setQ(x.it.id, s.q[x.it.t], true); });
          $("nm").value = s.nm || ""; $("ph").value = s.ph || ""; $("ad").value = s.ad || "";
        } catch (e) {}
      }

      function upd() {
        var L = lines(), c = {};
        L.forEach(function (l) { c[l.si] = (c[l.si] || 0) + 1; });
        D.secs.forEach(function (s, si) {
          $("c" + si).textContent = c[si] || "";
          $("c" + si).style.display = c[si] ? "inline-block" : "none";
        });
        $("bar").style.display = L.length ? "block" : "none";
        $("bc").textContent = L.length + " " + T("items");
        $("bt").textContent = inr(total(L)) + " · " + wt(L);
        $("tot").textContent = inr(total(L));
        $("twt").textContent = wt(L);
        $("lines").innerHTML = L.length
          ? L.map(function (l) { return '<div class="line"><span>' + esc(l.t) + "</span><b>" + l.q + " " + T("pcs") + "</b></div>"; }).join("")
          : '<p class="note">' + T("nothing") + "</p>";
        save();
      }

      // ---- Language ----
      function setLang(l) {
        LANG = TEXT[l] ? l : "hi";
        store("at_lang", LANG);
        document.documentElement.lang = LANG;
        document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T(el.dataset.t); });
        $("lang").textContent = T("other");
        $("q").placeholder = T("search");
        $("q").setAttribute("aria-label", T("search"));
        $("nm").placeholder = T("name");
        $("ph").placeholder = T("phone");
        $("ad").placeholder = T("addr");
        $("cl").setAttribute("aria-label", T("close"));
        document.querySelectorAll("[data-kg]").forEach(function (el) { el.textContent = "≈ " + el.dataset.kg + " " + T("perPc"); });
        document.querySelectorAll(".add").forEach(function (b) { b.setAttribute("aria-label", T("add")); });
        document.querySelectorAll(".qb").forEach(function (b) { b.setAttribute("aria-label", T(b.dataset.d === "1" ? "more" : "less")); });
        document.querySelectorAll(".askWa").forEach(function (a) { a.href = wa(T("askMsg")); });
        $("pv").style.display = $("pvn").style.display = "none";
        $("err").textContent = "";
        upd();
      }
      $("lang").onclick = function () { setLang(LANG === "hi" ? "en" : "hi"); };

      // ---- Sheet ----
      var lastFocus;
      function show(v) {
        if (v) { lastFocus = document.activeElement; $("err").textContent = ""; }
        $("ov").style.display = v ? "flex" : "none";
        document.body.classList.toggle("lock", v);
        if (v) $("cl").focus(); else if (lastFocus) lastFocus.focus();
      }
      $("open").onclick = function () { show(true); };
      $("cl").onclick = function () { show(false); };
      $("ov").addEventListener("click", function (e) { if (e.target === $("ov")) show(false); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") show(false); });
      ["nm", "ph", "ad"].forEach(function (k) { $(k).addEventListener("input", save); });

      $("send").onclick = function (e) {
        var L = lines(), nm = $("nm").value.trim(), ph = $("ph").value.trim(), ad = $("ad").value.trim();
        var bad = !L.length ? "errEmpty" : !nm ? "errName" : !ad ? "errAddr" : "";
        if (bad) {
          e.preventDefault();
          $("err").textContent = T(bad);
          if (bad === "errName") $("nm").focus();
          if (bad === "errAddr") $("ad").focus();
          return;
        }
        $("err").textContent = "";
        var m =
          T("hello") + "\n\n" +
          L.map(function (l, n) { return n + 1 + ". " + l.t + " – " + l.q + " " + T("pcs"); }).join("\n") +
          "\n\n" + T("estTotal") + ": " + inr(total(L)) +
          "\n" + T("estWeight") + ": " + wt(L) +
          "\n\n" + T("mName") + ": " + nm +
          (ph ? "\n" + T("mPhone") + ": " + ph : "") +
          "\n" + T("mAddr") + ": " + ad +
          "\n\n" + T("mEnd");
        $("send").href = wa(m);
        $("pv").value = m;
        $("pv").style.display = $("pvn").style.display = "block";
      };

      load();
      setLang(store("at_lang") || "hi");
    </script>
  </body>
</html>
